name: Build and publish Windows app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Publish GitHub release assets
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/AnimeWall-${GITHUB_REF_NAME#v}-setup.exe \
            dist/AnimeWall-${GITHUB_REF_NAME#v}-setup.exe.blockmap \
            dist/latest.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AnimeWall ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
